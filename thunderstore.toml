[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "CollectableWaypoints"
description = "Shows map waypoints for undiscovered data logs, pumpkins, bears, and other punch collectables so you can track them more easily."
websiteUrl = "https://github.com/Little-Sparroh/CollectableWaypoints"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/CollectableWaypoints.dll"
target = "BepInEx/plugins/CollectableWaypoints.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["mycopunk"]

[publish.categories]
mycopunk = ["client"]
